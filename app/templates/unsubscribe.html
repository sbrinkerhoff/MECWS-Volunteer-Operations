{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card card-glass border-0">
            <div class="card-body p-5">
                <h3 class="fw-bold mb-4">Unsubscribe Confirmation</h3>
                <p class="mb-4">Are you sure you want to unsubscribe <strong>{{ email }}</strong> from future MECWS
                    emails?</p>

                <form method="POST">
                    <button type="submit" class="btn btn-danger">Yes, Unsubscribe Me</button>
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
